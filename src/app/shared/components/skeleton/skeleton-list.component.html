<!-- skeleton-list.component.html -->
<div class="skeleton-list" [ngClass]="variant">
  <ng-container *ngFor="let _ of placeholders">
    <div *ngIf="variant === 'card'" class="skeleton-card" [style]="getSkeletonStyles()">
      <div class="skeleton-line w-60"></div>
      <div class="skeleton-line w-80"></div>
      <div class="skeleton-line w-40"></div>
    </div>

    <div *ngIf="variant === 'stat'" class="skeleton-stat" [style]="getSkeletonStyles()">
      <div class="skeleton-circle"></div>
      <div class="stat-lines">
        <div class="skeleton-line w-50"></div>
        <div class="skeleton-line w-30"></div>
      </div>
    </div>

    <div *ngIf="variant === 'quick'" class="skeleton-quick" [style]="getSkeletonStyles()">
      <div class="skeleton-circle sm"></div>
      <div class="quick-lines">
        <div class="skeleton-line w-70"></div>
        <div class="skeleton-line w-50"></div>
      </div>
      <div class="skeleton-line arrow"></div>
    </div>

    <div *ngIf="variant === 'table'" class="skeleton-table-row" [style]="getSkeletonStyles()">
      <div class="skeleton-cell w-20"></div>
      <div class="skeleton-cell w-30"></div>
      <div class="skeleton-cell w-25"></div>
      <div class="skeleton-cell w-15"></div>
      <div class="skeleton-cell w-10"></div>
    </div>

    <div *ngIf="variant === 'list'" class="skeleton-list-row" [style]="getSkeletonStyles()">
      <div class="skeleton-circle sm"></div>
      <div class="list-lines">
        <div class="skeleton-line w-80"></div>
        <div class="skeleton-line w-40"></div>
      </div>
    </div>
  </ng-container>
</div>
