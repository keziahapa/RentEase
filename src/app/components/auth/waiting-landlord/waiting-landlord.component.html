<div class="waiting-container">
  <div class="waiting-card">
  
    <div class="status">
      <div class="status-icon">✓</div>
      <h1>Account Ready</h1>
      <p>Your profile is now visible to landlords</p>
    </div>

 
    <div class="next-steps">
      <h3>Next Steps</h3>
      <ul>
        <li>Landlords will contact you for property invitations</li>
        <li>You'll receive an email when invited</li>
        <li>Accept invitation to access dashboard</li>
      </ul>
    </div>


    <div class="action">
      <button class="logout-btn" (click)="logout()">
        Sign Out
      </button>
    </div>
  </div>
</div>
