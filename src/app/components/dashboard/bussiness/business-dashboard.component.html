
<div class="dashboard-container">
  <div class="mobile-menu-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
  
  <nav class="sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-header">
      <div class="logo" (click)="navigateToSection('dashboard')">
               <img src="/images/logo.png" alt="RentEase Logo" class="logo-image">
      </div>
    </div>

    <div class="nav-menu">
      <div class="nav-item" 
           [class.active]="isNavActive('dashboard')" 
           (click)="navigateToSection('dashboard')">
        <mat-icon class="nav-icon">dashboard</mat-icon>
        <span>Dashboard</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('ads')" 
           (click)="navigateToSection('ads')">
        <mat-icon class="nav-icon">campaign</mat-icon>
        <span>My Ads</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('create-ad')" 
           (click)="navigateToSection('create-ad')">
        <mat-icon class="nav-icon">add_circle</mat-icon>
        <span>Create Ad</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('analytics')" 
           (click)="navigateToSection('analytics')">
        <mat-icon class="nav-icon">analytics</mat-icon>
        <span>Analytics</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('billing')" 
           (click)="navigateToSection('billing')">
        <mat-icon class="nav-icon">receipt</mat-icon>
        <span>Billing</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('documents')" 
           (click)="navigateToSection('documents')">
        <mat-icon class="nav-icon">description</mat-icon>
        <span>Documents</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('messages')" 
           (click)="navigateToSection('messages')">
        <mat-icon class="nav-icon">message</mat-icon>
        <span>Messages</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('profile')" 
           (click)="viewProfile()">
        <mat-icon class="nav-icon">business</mat-icon>
        <span>Business Profile</span>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-header">
      <div class="header-left">
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="greeting-section">
          <h1>{{ getGreetingMessage() }}</h1>
          <p>Here's what's happening with your business ads today</p>
        </div>
      </div>

      <div class="header-right">
        <div class="header-actions">
          <button class="notification-btn" (click)="viewNotifications()" 
                  [class.has-notifications]="unreadNotificationsCount > 0"
                  matTooltip="{{ unreadNotificationsCount > 0 ? unreadNotificationsCount + ' unread notifications' : 'No new notifications' }}"
                  matTooltipPosition="below">
            <mat-icon>notifications</mat-icon>
            <span class="notification-badge" *ngIf="unreadNotificationsCount > 0">
              {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
            </span>
          </button>
        </div>

        <div class="profile-section">
          <div class="user-avatar-wrapper" (click)="toggleProfileMenu(); $event.stopPropagation()">
            <div class="user-avatar">
              <img *ngIf="profileImage" [src]="profileImage" alt="Business Logo" class="avatar-image">
              <div *ngIf="!profileImage" class="avatar-placeholder">
                <mat-icon>business</mat-icon>
              </div>
            </div>
          </div>

          <div class="dropdown-trigger" (click)="toggleProfileMenu(); $event.stopPropagation()">
            <mat-icon class="dropdown-chevron" [class.rotated]="isProfileMenuOpen">expand_more</mat-icon>
          </div>

          <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
            <button class="dropdown-item" (click)="editProfile(); $event.stopPropagation()">
              <mat-icon>edit</mat-icon>
              <span>Edit Business Profile</span>
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" 
                    (click)="logout(); $event.stopPropagation()"
                    [disabled]="isLoggingOut">
              <mat-icon>logout</mat-icon>
              <span>{{ isLoggingOut ? 'Logging out...' : 'Logout' }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <router-outlet></router-outlet>
  </main>
</div>
