<div class="profile-view-container">
  <div class="profile-content">
    <div class="form-container">
      <div class="profile-form">
        
        <div class="form-header">
          <h1 class="page-title">My Profile</h1>
        </div>

        <div class="avatar-section">
          <div class="avatar-container">
            <div class="user-avatar-large">
              <img *ngIf="profileImage && !isLoadingProfilePicture" 
                   [src]="profileImage" 
                   alt="Profile" 
                   class="avatar-image-large" 
                   (error)="handleImageError()">
              <div *ngIf="isLoadingProfilePicture" class="image-loading-overlay">
                <mat-spinner diameter="24"></mat-spinner>
              </div>
              <div *ngIf="!profileImage && !isLoadingProfilePicture" class="avatar-placeholder-large">
                <mat-icon>account_circle</mat-icon>
              </div>
            </div>
          </div>
        </div>

        <div class="profile-info-card">
          <div class="info-section">
            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">Full Name</div>
                <div class="info-value">{{ getUserFullName() }}</div>
              </div>

              <div class="info-item">
                <div class="info-label">Email Address</div>
                <div class="info-value">{{ getUserEmail() }}</div>
              </div>

              <div class="info-item">
                <div class="info-label">Phone Number</div>
                <div class="info-value">{{ getUserPhone() }}</div>
              </div>

              <div class="info-item">
                <div class="info-label">Role</div>
                <div class="info-value">{{ formattedRole }}</div>
              </div>

              <div class="info-item">
                <div class="info-label">Email Verification</div>
                <div class="status-badge" [class.verified]="user?.emailVerified" [class.unverified]="!user?.emailVerified">
                  {{ getEmailVerificationStatus() }}
                </div>
              </div>

              <div class="info-item">
                <div class="info-label">Account Status</div>
                <div class="info-value">{{ getAccountStatus() }}</div>
              </div>

              <div class="info-item">
                <div class="info-label">Member Since</div>
                <div class="info-value">{{ getMemberSince() }}</div>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-outline" (click)="goBack()">
              Back to Dashboard
            </button>
            <button type="button" class="btn-primary" (click)="editProfile()">
              <mat-icon>edit</mat-icon>
              <span>Edit Profile</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
