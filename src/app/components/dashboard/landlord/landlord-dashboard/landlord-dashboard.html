<div class="dashboard-container">
  <div class="mobile-menu-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
  
  <nav class="sidebar" [class.mobile-open]="isMobileMenuOpen">
    <div class="sidebar-header">
      <div class="logo" (click)="navigateToSection('dashboard')">
        <img src="/images/logo.png" alt="RentEase Logo" class="logo-image">
      </div>
    </div>

    <div class="nav-menu">
      <div class="nav-item" 
           [class.active]="isNavActive('dashboard')" 
           (click)="navigateToSection('dashboard')">
        <mat-icon class="nav-icon">dashboard</mat-icon>
        <span>Dashboard</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('properties')" 
           (click)="navigateToSection('properties')">
        <mat-icon class="nav-icon">apartment</mat-icon>
        <span>Properties</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('tenants')" 
           (click)="navigateToSection('tenants')">
        <mat-icon class="nav-icon">groups</mat-icon>
        <span>Tenants</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('financials')" 
           (click)="navigateToSection('financials')">
        <mat-icon class="nav-icon">payments</mat-icon>
        <span>Financials</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('maintenance')" 
           (click)="navigateToSection('maintenance')">
        <mat-icon class="nav-icon">handyman</mat-icon>
        <span>Maintenance</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('messages')" 
           (click)="navigateToSection('messages')">
        <mat-icon class="nav-icon">message</mat-icon>
        <span>Messages</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('marketplace')" 
           (click)="navigateToSection('marketplace')">
        <mat-icon class="nav-icon">store</mat-icon>
        <span>Marketplace</span>
      </div>

      <div class="nav-item" 
           [class.active]="isNavActive('settings')" 
           (click)="navigateToSection('settings')">
        <mat-icon class="nav-icon">settings</mat-icon>
        <span>Settings</span>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-header">
      <div class="header-left">
        <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="greeting-section">
          <h1>{{ getGreetingMessage() }}</h1>
          <p>Here's what's happening with your properties today</p>
        </div>
      </div>

      <div class="header-right">
        <div class="header-actions">
          <button class="notification-btn" (click)="viewNotifications()" 
                  [class.has-notifications]="unreadNotificationsCount > 0"
                  matTooltip="{{ unreadNotificationsCount > 0 ? unreadNotificationsCount + ' unread notifications' : 'No new notifications' }}"
                  matTooltipPosition="below">
            <mat-icon>notifications</mat-icon>
            <span class="notification-badge" *ngIf="unreadNotificationsCount > 0">
              {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
            </span>
          </button>
        </div>

        <div class="profile-section">
          <div class="user-avatar-wrapper" (click)="viewProfile(); $event.stopPropagation()">
            <div class="user-avatar">
              <img *ngIf="profileImage" [src]="profileImage" alt="Profile" class="avatar-image">
              <div *ngIf="!profileImage" class="avatar-placeholder">
                <mat-icon>account_circle</mat-icon>
              </div>
            </div>
          </div>

          <div class="dropdown-trigger" (click)="toggleProfileMenu(); $event.stopPropagation()">
            <mat-icon class="dropdown-chevron" [class.rotated]="isProfileMenuOpen">expand_more</mat-icon>
          </div>

          <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
            <button class="dropdown-item" (click)="editProfile(); $event.stopPropagation()">
              <mat-icon>edit</mat-icon>
              <span>Edit Profile</span>
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" 
                    (click)="logout(); $event.stopPropagation()"
                    [disabled]="isLoggingOut">
              <mat-icon>logout</mat-icon>
              <span>{{ isLoggingOut ? 'Logging out...' : 'Logout' }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Home Content -->
    <div *ngIf="currentSection === 'dashboard'" class="dashboard-home">
      <app-landlord-dashboard-home></app-landlord-dashboard-home>
    </div>

    <!-- Router Outlet for other sections -->
    <router-outlet *ngIf="currentSection !== 'dashboard'"></router-outlet>
  </main>
</div>
