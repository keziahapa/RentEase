components:
  schemas:
    UpdatePhoneRequest:
      required:
      - newPhoneNumber
      type: object
      properties:
        newPhoneNumber:
          type: string
    UpdatePasswordRequest:
      required:
      - confirmNewPassword
      - currentPassword
      - newPassword
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
        confirmNewPassword:
          type: string
    PropertyCreateRequest:
      required:
      - location
      - name
      - propertyType
      - totalUnits
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        propertyType:
          type: string
        totalUnits:
          minimum: 1
          type: integer
          format: int32
        description:
          type: string
    CaretakerInvitationRequest:
      required:
      - caretakerEmail
      - propertyId
      type: object
      properties:
        caretakerEmail:
          type: string
        propertyId:
          type: integer
          format: int64
    ExternalBusinessRegistrationRequest:
      required:
      - businessName
      - businessRegistrationNumber
      type: object
      properties:
        businessName:
          type: string
        businessRegistrationNumber:
          type: string
    AdvertisementRequest:
      required:
      - mediaType
      - mediaUrl
      - title
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        mediaUrl:
          type: string
        mediaType:
          type: string
          enum:
          - IMAGE
          - VIDEO
    UnitCreateRequest:
      required:
      - unitNumber
      - unitType
      type: object
      properties:
        unitNumber:
          type: string
        unitType:
          type: string
        description:
          type: string
        deposit:
          type: integer
          format: int32
        rentAmount:
          type: integer
          format: int32
    TenantInvitationRequest:
      required:
      - tenantEmail
      - unitId
      type: object
      properties:
        tenantEmail:
          type: string
        unitId:
          type: integer
          format: int64
    OtpVerificationRequest:
      required:
      - email
      - otpCode
      type: object
      properties:
        email:
          type: string
        otpCode:
          type: string
    SignupRequest:
      required:
      - confirmPassword
      - email
      - fullName
      - password
      - phoneNumber
      - role
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        password:
          type: string
        confirmPassword:
          type: string
        role:
          type: string
          enum:
          - TENANT
          - CARETAKER
          - LANDLORD
          - ADMIN
          - EXTERNAL_BUSINESS
    ResetPasswordRequest:
      required:
      - email
      - newPassword
      - otpCode
      type: object
      properties:
        email:
          type: string
        otpCode:
          type: string
        newPassword:
          type: string
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    ForgotPasswordRequest:
      required:
      - email
      type: object
      properties:
        email:
          type: string
    VerificationRequest:
      type: object
      properties:
        rejectionReason:
          type: string
    InvitationAcceptRequest:
      required:
      - invitationToken
      type: object
      properties:
        invitationToken:
          type: string
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT bearer controller
      in: header
      scheme: bearer
      bearerFormat: JWT
